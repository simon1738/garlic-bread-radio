<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garlic Bread Radio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="freq">
        <a id="wiux-link" href="https://wiux.org" target="_blank"
          >WIUX B-Side Internet Radio</a
        >
      </div>
      <h1 id="site-title">GARLIC BREAD RADIO</h1>

      <div id="album-bar">
        <div class="image-container">
          <img class="image" src="photos/album-art/clairo.jpg" alt="" />
          <img class="image" src="photos/album-art/hum.jpg" alt="" />
          <img class="image" src="photos/album-art/pharcyde.jpg" alt="" />
          <img class="image" src="photos/album-art/blindmelon.jpg" alt="" />
          <img class="image" src="photos/album-art/underscores.jpg" alt="" />
          <img class="image" src="photos/album-art/elo.jpg" alt="" />
          <img class="image" src="photos/album-art/dannyjpeg.jpg" alt="" />
          <img class="image" src="photos/album-art/steelydan.jpg" alt="" />
          <img class="image" src="photos/album-art/macdemarco.jpg" alt="" />
          <img class="image" src="photos/album-art/gorillaz.jpg" alt="" />
          <img class="image" src="photos/album-art/joey.jpg" alt="" />
          <img class="image" src="photos/album-art/pinback.jpg" alt="" />
          <img class="image" src="photos/album-art/stevelacy.jpg" alt="" />
          <img class="image" src="photos/album-art/dandywarhols.jpg" alt="" />
          <img class="image" src="photos/album-art/stevemiller.jpg" alt="" />
          <img class="image" src="photos/album-art/internet.jpg" alt="" />
          <img class="image" src="photos/album-art/nirvana.jpg" alt="" />
          <img class="image" src="photos/album-art/blur.jpg" alt="" />
        </div>
      </div>

      <nav id="nav">
        <ul>
          <li><a href="#" class="nav-link">Home</a></li>
          <li><a href="index.html" class="nav-link active">Setlists</a></li>
          <li><a href="#" class="nav-link">Listen Now</a></li>
          <li><a href="#" class="nav-link">Stats</a></li>
          <li><a href="#" class="nav-link">My Scrobbles</a></li>
        </ul>
      </nav>
      <p id="site-sub"></p>
    </header>

    <main>
      <div class="controls">
        <input
          type="text"
          id="search"
          placeholder="Search for artists, tracks, or episodes..."
        />

        <div class="sort-select-wrap">
          <select id="sort-select" class="sort-select">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
          </select>
        </div>
      </div>

      <section id="episode-grid" class="episode-grid" aria-live="polite">
        <!-- episode cards get injected here -->
        <p class="loading-msg">One moment...</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>Thanks for visiting</p>
    </footer>

    <button
      id="back-to-top"
      class="back-to-top"
      aria-label="Back to top"
      title="Back to top"
    >
      &uarr;
    </button>

    <!-- episode detail template -->
    <template id="episode-card-template">
      <details class="episode-card">
        <summary class="episode-card-summary">
          <div class="episode-card-header">
            <span class="episode-number"></span>
            <span class="episode-date"></span>
          </div>
          <h2 class="episode-title"></h2>
        </summary>

        <p class="episode-description"></p>
        <ol class="tracklist"></ol>
      </details>
    </template>

    <!-- track row template -->
    <template id="track-row-template">
      <li class="track-row">
        <span class="track-index"></span>
        <img class="track-art" alt="" loading="lazy" />
        <div class="track-meta">
          <span class="track-name"></span>
          <span class="track-artist"></span>
        </div>
      </li>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Observer.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
