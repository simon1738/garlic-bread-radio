<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats - Garlic Bread Radio</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/stats.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="freq">
        <a id="wiux-link" href="https://wiux.org" target="_blank"
          >WIUX B-Side Internet Radio</a
        >
      </div>
      <h1 id="site-title">GARLIC BREAD RADIO</h1>

      <div id="album-bar">
        <div class="image-container">
          <img class="image" src="photos/album-art/clairo.jpg" alt="" />
          <img class="image" src="photos/album-art/hum.jpg" alt="" />
          <img class="image" src="photos/album-art/pharcyde.jpg" alt="" />
          <img class="image" src="photos/album-art/blindmelon.jpg" alt="" />
          <img class="image" src="photos/album-art/underscores.jpg" alt="" />
          <img class="image" src="photos/album-art/elo.jpg" alt="" />
          <img class="image" src="photos/album-art/dannyjpeg.jpg" alt="" />
          <img class="image" src="photos/album-art/steelydan.jpg" alt="" />
          <img class="image" src="photos/album-art/macdemarco.jpg" alt="" />
          <img class="image" src="photos/album-art/gorillaz.jpg" alt="" />
          <img class="image" src="photos/album-art/joey.jpg" alt="" />
          <img class="image" src="photos/album-art/pinback.jpg" alt="" />
          <img class="image" src="photos/album-art/stevelacy.jpg" alt="" />
          <img class="image" src="photos/album-art/dandywarhols.jpg" alt="" />
          <img class="image" src="photos/album-art/stevemiller.jpg" alt="" />
          <img class="image" src="photos/album-art/internet.jpg" alt="" />
          <img class="image" src="photos/album-art/nirvana.jpg" alt="" />
          <img class="image" src="photos/album-art/blur.jpg" alt="" />
          <img class="image" src="photos/album-art/slayr.jpg" alt="" />
        </div>
      </div>

      <nav id="nav">
        <ul>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="setlists.html" class="nav-link">Setlists</a></li>
          <li><a href="listen-now.html" class="nav-link">Listen Now</a></li>
          <li><a href="stats.html" class="nav-link active">Stats</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
        </ul>
      </nav>
      <p id="site-sub">The numbers</p>
    </header>

    <main class="stats-main">
      <section class="stats-summary">
        <div class="stat-card">
          <span class="stat-value" id="episode-count">–</span>
          <span class="stat-label">shows to date</span>
        </div>
      </section>

      <section class="stats-artists">
        <h2>Top 20 Most-Played Artists</h2>
        <ol id="artist-list" class="artist-list" aria-live="polite">
          <li class="loading-msg">One moment...</li>
        </ol>
      </section>
    </main>

    <footer class="site-footer">
      <p>Thanks for visiting</p>
    </footer>

    <button
      id="back-to-top"
      class="back-to-top"
      aria-label="Back to top"
      title="Back to top"
    >
      &uarr;
    </button>

    <!-- artist row template -->
    <template id="artist-row-template">
      <li class="artist-row">
        <span class="artist-rank"></span>
        <span class="artist-name"></span>
        <span class="artist-count"></span>
      </li>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Observer.min.js"></script>
    <script src="js/base.js"></script>
    <script src="js/stats.js"></script>
  </body>
</html>
